<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="4176" height="2752" viewBox="0 0 4176 2752">
  <title>Fitlet iPad ストア用ファーストビュー</title>
  <desc>1枚のiPadホーム画面を大きく斜めに配置し、ストア1枚目と2枚目にまたがせた構成。</desc>
  <defs>
    <linearGradient id="tabletBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111318"/>
      <stop offset="0.46" stop-color="#30343a"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <filter id="tabletShadow" x="-30%" y="-20%" width="170%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="35" stdDeviation="30" flood-color="#111318" flood-opacity="0.24"/>
    </filter>
    <clipPath id="homeScreenClip">
      <rect x="1192" y="102" width="1776" height="2555" rx="82"/>
    </clipPath>
  </defs>

  <rect width="4176" height="2752" fill="#e4f5f4"/>
  <image x="110" y="92" width="350" height="184" xlink:href="./fitlet_logo.svg" preserveAspectRatio="xMidYMid meet"/>

  <g transform="rotate(-25 2088 1376)" filter="url(#tabletShadow)">
    <rect x="1180" y="80" width="1800" height="2600" rx="126" fill="url(#tabletBody)"/>
    <rect x="1192" y="102" width="1776" height="2555" rx="82" fill="#ffffff"/>
    <image x="1192" y="102" width="1776" height="2555" xlink:href="./screens/ipad/ja/real-home.png" preserveAspectRatio="none" clip-path="url(#homeScreenClip)"/>
    <circle cx="2090" cy="126" r="10" fill="#111318"/>
  </g>

  <g fill="#111318" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-weight="950">
    <g transform="translate(120 0)">
      <text x="0" y="2490" font-size="160" letter-spacing="-14.4">ちょっと動くを</text>
      <text x="0" y="2660" font-size="160" letter-spacing="-14.4">習慣に</text>
    </g>
    <g transform="translate(4056 0)" text-anchor="end">
      <text x="0" y="318" font-size="160" letter-spacing="-14.4">動くと</text>
      <text x="0" y="488" font-size="160" letter-spacing="-14.4">マップが進む</text>
      <text x="0" y="670" font-size="92" font-weight="780" letter-spacing="-6.4">1回約8分で 次の場所へ</text>
    </g>
  </g>
  <line x1="120" y1="2700" x2="570" y2="2700" stroke="#20b8c3" stroke-width="12" stroke-linecap="round"/>
  <line x1="3190" y1="530" x2="4056" y2="530" stroke="#20b8c3" stroke-width="12" stroke-linecap="round"/>
</svg>
